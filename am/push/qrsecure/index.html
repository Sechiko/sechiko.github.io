<!doctype html>
<html><head><meta charset="utf-8"><title>vib</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>body{font-family:monospace;background:#111;color:#0f0;padding:20px;font-size:20px;word-break:break-all}</style>
</head><body>
<div id="s">VIBRATION TEST</div>
<div id="r" style="color:#ff0;font-size:22px;margin-top:16px"></div>
<script>
(function(){
 var na = window.nativeAMAndroid;
 document.getElementById('s').textContent = 'bridge: ' + (na ? 'FOUND' : 'NONE');
 if(!na) return;
 window.nativeAMResponse = { receive: function(id, json){ document.getElementById('r').textContent = 'RESP: ' + String(json); } };
 setTimeout(function(){
   na.send(JSON.stringify({version:1, message:'performVibration', requestId:'vib1', data:{}}));
   document.getElementById('r').textContent = 'sent performVibration...';
 }, 800);
})();
</script></body></html>
